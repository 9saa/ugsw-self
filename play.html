<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening game — UGSW</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
/* Legacy links pointed at the player page. Games are standalone documents, so
   send the old ?game= form straight to the file itself. */
(function () {
  var raw = '';
  try { raw = new URLSearchParams(location.search).get('game') || ''; } catch (e) {}
  if (!raw) { location.replace('index.html'); return; }
  location.replace('games/' + encodeURIComponent(raw) + '.html');
})();
</script>
<style>
  body {
    margin: 0;
    padding: 32px;
    background: #f4f0e5;
    color: #17150f;
    font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  a { color: #b23c16; }
  @media (prefers-color-scheme: dark) {
    body { background: #14130f; color: #f2ecdf; }
    a { color: #ff7a45; }
  }
</style>
</head>
<body>
<p>Opening the game…</p>
<p><a href="index.html">Back to the catalogue</a></p>
</body>
</html>
