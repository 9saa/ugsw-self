<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening game — UGSW</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>
/* Legacy links pointed at the player page. Games are standalone documents, so
   send the old ?game= form straight to the file itself. Each game lives in the
   folder for its catalogue group (games/s/, games/1/, games/other/).

   games.json can name another host in gameBase when this deployment does not
   carry the games folder, so the manifest decides where the game actually is. */
(function () {
  var raw = '';
  try { raw = new URLSearchParams(location.search).get('game') || ''; } catch (e) {}
  if (!raw) { location.replace('index.html'); return; }

  var rest = /^cl/.test(raw) ? raw.slice(2) : raw;
  var first = rest.normalize('NFD').charAt(0).toUpperCase();
  var folder = /^[A-Z0-9]$/.test(first) ? first.toLowerCase() : 'other';
  var fallback = 'games/' + folder + '/' + encodeURIComponent(raw) + '.html';

  function go(url) { location.replace(url); }
  function encode(path) {
    return String(path).split('/').map(encodeURIComponent).join('/');
  }

  var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
  var timer = controller ? setTimeout(function () { controller.abort(); }, 1500) : null;

  fetch('games.json', controller ? { signal: controller.signal } : undefined)
    .then(function (response) { return response.ok ? response.json() : null; })
    .then(function (data) {
      if (timer) clearTimeout(timer);
      var games = (data && data.games) || [];
      for (var i = 0; i < games.length; i++) {
        if (games[i] && games[i].id === raw) {
          var base = data.gameBase ? String(data.gameBase).replace(/\/+$/, '') + '/' : '';
          go(base + encode(games[i].path));
          return;
        }
      }
      go(fallback);
    })
    .catch(function () {
      if (timer) clearTimeout(timer);
      go(fallback);
    });
})();
</script>
<style>
  body {
    margin: 0;
    padding: 32px;
    background: #f4f0e5;
    color: #17150f;
    font: 16px/1.55 system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  a { color: #b23c16; }
  @media (prefers-color-scheme: dark) {
    body { background: #14130f; color: #f2ecdf; }
    a { color: #ff7a45; }
  }
</style>
</head>
<body>
<p>Opening the game…</p>
<p><a href="index.html">Back to the catalogue</a></p>
</body>
</html>
